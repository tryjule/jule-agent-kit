description = "Build a Jule preference center (Iterable channels and message types) from a brief — validate, save, preview; publish only on request"
prompt = """Build a Jule preference center with the jule MCP server, following the jule-builder skill (its Preference centers section and workflow) exactly.

Brief: {{args}}

If the brief is empty, ask what visitors should be able to manage and how they arrive (from Iterable emails or logged in) before calling any tool. Call whoami first; when the organization has several workspaces and none is named, list them and ask. The integrations resource must show Iterable connected and active — otherwise stop and tell the user to connect Iterable in Settings → Integrations. Build the channels group from the live channel and message-type ids, mirror them in settings_config.iterable_integration, link the branding header and footer, fill the SEO fields. Validate until it passes, check for a same-named project, save, and put the preview_url on its own line. Do not publish."""
